<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Compass" />
  <title>Compass</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2" />
  <link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- PIN lock -->
  <div class="lock" id="lock">
    <div class="lmark">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 10.5 10.5 8.5 15.5 13.5 13.5" fill="#fff" stroke="none"/></svg>
    </div>
    <div style="text-align:center">
      <h2 id="lockTitle">Enter passcode</h2>
      <div class="hint" id="lockHint">Welcome back</div>
    </div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
    <button id="forgotPin" class="btn ghost" hidden style="color:#fff;opacity:.75;width:auto">Forgot passcode?</button>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 10.5 10.5 8.5 15.5 13.5 13.5" fill="#fff" stroke="none"/></svg>
        </span>
        <span id="brandName">Compass</span>
      </div>
      <div class="actions">
        <button class="iconbtn" id="btnSync" title="Sync now"><span class="sync-dot off" id="syncDot"></span></button>
        <button class="iconbtn" id="btnSettings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="view" id="view-home"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-health"></section>
      <section class="view" id="view-money"></section>
      <section class="view" id="view-systems"></section>
    </main>
  </div>

  <!-- Bottom nav -->
  <nav class="nav" id="nav" hidden>
    <div class="inner">
      <button data-tab="home" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Home
      </button>
      <button data-tab="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
        Calendar
      </button>
      <button data-tab="health">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-5 4 10 2-5h5"/></svg>
        Health
      </button>
      <button data-tab="money">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>
        Money
      </button>
      <button data-tab="systems">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Systems
      </button>
    </div>
  </nav>

  <!-- Modal sheet -->
  <div class="scrim" id="scrim">
    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>

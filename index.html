  <!-- PIN lock -->
  <div class="lock" id="lock">
    <div class="lmark">
      <svg class="ic" style="width:30px;height:30px"><use href="#i-compass"/></svg>
    </div>
    <div style="text-align:center">
      <h2 id="lockTitle">Enter passcode</h2>
      <div class="hint" id="lockHint">Welcome back</div>
    </div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
    <button id="forgotPin" class="btn ghost" hidden style="width:auto;color:var(--text-2)">Forgot passcode?</button>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="mark"><svg class="ic" style="width:22px;height:22px"><use href="#i-compass"/></svg></span>
        <span id="brandName">Compass</span>
      </div>
      <div class="actions">
        <button class="iconbtn" id="btnSearch" title="Search" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="iconbtn" id="btnAdd" title="Add" aria-label="Add"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button class="iconbtn" id="btnSettings" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-settings"/></svg><span class="sync-dot off" id="syncDot"></span></button>
      </div>
    </header>

    <main>
      <section class="view" id="view-home"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-health"></section>
      <section class="view" id="view-money"></section>
      <section class="view" id="view-systems"></section>
    </main>
  </div>

  <!-- Bottom nav -->
  <nav class="nav" id="nav" hidden>
    <div class="inner">
      <button data-tab="home" class="on"><svg class="ic"><use href="#i-home"/></svg>Today</button>
      <button data-tab="calendar"><svg class="ic"><use href="#i-calendar"/></svg>Calendar</button>
      <button data-tab="health"><svg class="ic"><use href="#i-activity"/></svg>Health</button>
      <button data-tab="money"><svg class="ic"><use href="#i-wallet"/></svg>Money</button>
      <button data-tab="systems"><svg class="ic"><use href="#i-target"/></svg>Systems</button>
    </div>
  </nav>

  <!-- quick add (phones) -->
  <button class="fab" id="fab" hidden aria-label="Quick add"><svg class="ic"><use href="#i-plus"/></svg></button>
  <div class="ptr" id="ptr" aria-hidden="true"><span></span></div>

  <!-- Modal sheet -->
  <div class="scrim" id="scrim">
    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js?v=40"></script>
</body>
</html>
